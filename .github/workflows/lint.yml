name: lint

# Runs sqlfluff on every pull request into main. Make this check "Required" in
# the branch-protection rules for main so a PR cannot be merged until the lint
# passes (Settings -> Branches -> Branch protection rules).
on:
  pull_request:
    branches: [main]

# A newer push to the same PR cancels the in-flight run.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlfluff:
    name: sqlfluff lint (dbt models)
    runs-on: ubuntu-latest

    # sqlfluff uses the dbt templater, which compiles the project and therefore
    # needs a reachable Postgres. It only compiles SQL (no data is read), so an
    # empty database is enough — no Olist CSVs required in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: olist
          POSTGRES_DB: olist
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U olist -d olist"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # dbt/profiles.yml resolves the connection from these (see that file).
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: olist
      DB_PASSWORD: olist
      DB_NAME: olist
      DBT_SCHEMA: staging
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

    defaults:
      run:
        working-directory: dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Pinned to match load/Dockerfile + the local venv so CI lints exactly
      # what developers lint locally.
      - name: Install dbt + sqlfluff
        run: |
          python -m pip install --upgrade pip
          pip install \
            dbt-postgres==1.9.1 \
            sqlfluff==4.1.0 \
            sqlfluff-templater-dbt==4.1.0

      # Fetch codegen + dbt_utils; the dbt templater needs them to compile.
      - name: dbt deps
        run: dbt deps

      - name: sqlfluff lint
        run: sqlfluff lint models/
