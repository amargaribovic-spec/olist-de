name: pipeline

# Proves the pipeline end-to-end on every PR, using a synthetic dataset so no
# real Olist CSVs (gitignored, ~120 MB) are needed in CI. Mirrors ./run.sh fresh:
# generate a synthetic dataset, full load, full-refresh dbt build + tests.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    name: pipeline (synthetic data)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: olist
          POSTGRES_DB: olist
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U olist -d olist"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: olist
      DB_PASSWORD: olist
      DB_NAME: olist
      DB_SCHEMA: raw                                   # loader lands raw here
      DBT_SCHEMA: dbt_ci                               # dbt base schema (layers split by generate_schema_name)
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt + loader deps
        run: |
          python -m pip install --upgrade pip
          pip install dbt-postgres==1.9.1 psycopg2-binary python-dotenv

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      # ---------- FRESH FLOW (first-ever run) ----------
      - name: Generate synthetic seed dataset
        run: python load/generate_seed_dataset.py --seed 42

      - name: Load raw (full)
        run: python load/load_raw.py --full

      - name: dbt build --full-refresh (+ tests)
        working-directory: dbt
        run: dbt build --full-refresh
