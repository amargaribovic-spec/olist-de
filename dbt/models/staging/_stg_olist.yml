version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        tests:
          - not_null
      - name: zip_code_prefix
        tests:
          - not_null
      - name: customer_city
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null
          # Every customer state must map to a region in the seed.
          - relationships:
              arguments:
                to: ref('state_region')
                field: state

  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          # Almost 1:1 with orders — exactly one customer_id appears on two orders.
          # Kept as a warn so the known exception stays visible and we'd notice if
          # it ever grew, rather than silently dropping the assertion.
          - unique:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        tests:
          - not_null
          # WARN not error: Olist could introduce a new, valid status — we want to
          # be alerted, not have the pipeline break on new incoming data.
          - accepted_values:
              arguments:
                values:
                  - delivered
                  - shipped
                  - canceled
                  - unavailable
                  - invoiced
                  - processing
                  - created
                  - approved
              config:
                severity: warn

  - name: stg_order_items
    columns:
      - name: order_item_sk
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id
      - name: shipping_limit_date
        tests:
          - not_null
      - name: price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: freight_value
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: stg_order_payments
    columns:
      - name: payment_sk
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_sequential
        tests:
          - not_null
      - name: payment_type
        tests:
          - not_null
          # WARN not error: a new, valid payment_type (e.g. pix) must not break
          # the pipeline on new incoming data.
          - accepted_values:
              arguments:
                values:
                  - credit_card
                  - boleto
                  - voucher
                  - debit_card
                  - not_defined
              config:
                severity: warn
      - name: payment_installments
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: payment_value
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: stg_order_reviews
    columns:
      - name: review_sk
        tests:
          - unique
          - not_null
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: review_creation_date
        tests:
          - not_null
      - name: review_answer_timestamp
        tests:
          # WARN not error: the answer timestamp is legitimately absent for a
          # recently-created review whose survey has not been answered yet, so
          # incoming data can carry nulls here without the pipeline breaking.
          - not_null:
              config:
                severity: warn

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      # product_category_name has known gaps in the source, so no not_null here.
      # It links to the translation table, but a handful of categories are missing
      # a translation — surfaced as a warning rather than a hard failure.
      - name: product_category_name
        tests:
          - relationships:
              arguments:
                to: ref('stg_product_category_translation')
                field: product_category_name
              config:
                severity: warn

  - name: stg_sellers
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
      - name: zip_code_prefix
        tests:
          - not_null
      - name: seller_city
        tests:
          - not_null
      - name: seller_state
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('state_region')
                field: state

  - name: stg_product_category_translation
    columns:
      - name: product_category_name
        tests:
          - unique
          - not_null
      - name: product_category_name_english
        tests:
          - unique
          - not_null

  - name: stg_geolocation
    # zip_code_prefix is NOT unique here (many geo points per zip) — dedup happens
    # in the intermediate layer later, so we only assert not_null for now.
    columns:
      - name: zip_code_prefix
        tests:
          - not_null
