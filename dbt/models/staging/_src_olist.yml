version: 2

sources:
  - name: olist
    schema: raw
    description: "Raw Olist e-commerce data, loaded as-is from the source CSVs (all columns TEXT)."
    tables:
      # Raw is an APPEND-ONLY landing zone: a key can legitimately appear more than
      # once over time (an updated record arrives as a new row with a later
      # _loaded_at). So uniqueness is NOT asserted here — it's enforced in staging
      # after dedup-to-latest. At the source we only require keys to be present.
      - name: customers
        columns:
          - name: customer_id
            tests:
              - not_null
      - name: geolocation
      - name: order_items
      - name: order_payments
      - name: order_reviews
      - name: orders
        columns:
          - name: order_id
            tests:
              - not_null
      - name: product_category_translation
        columns:
          - name: product_category_name
            tests:
              - not_null
      - name: products
        columns:
          - name: product_id
            tests:
              - not_null
      - name: sellers
        columns:
          - name: seller_id
            tests:
              - not_null
